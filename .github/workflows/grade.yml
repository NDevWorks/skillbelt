# Grades the skills in my-belt/ on every push and updates your belt badge.
name: Grade

on:
  push:
    branches-ignore: [badges]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Grade my-belt/
        run: node grader/grade.mjs --summary "$GITHUB_STEP_SUMMARY" --badge out/belt.json

      # Publishes out/belt.json to the `badges` branch of your fork, for the README badge
      - name: Update badge
        if: always() && github.repository != 'NDevWorks/skillbelt' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f out/belt.json ] || exit 0
          cd out
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add belt.json
          git commit -qm "Update belt badge"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
          echo "Badge: $(cat belt.json | tr -d '\n ')"
